            renderCurrentQuestion() {
                const q = this.questions[this.currentIndex];
                if (!q) return;

                const qContainer = document.getElementById('question-card-container');
                const selectedOpt = this.userAnswers[q.id];
                const isFlagged = this.flagged.has(q.id);

                const flagBtn = document.getElementById('flag-btn');
                if (flagBtn) {
                    flagBtn.className = isFlagged 
                        ? 'p-2 rounded-xl border border-amber-300 bg-amber-50 text-amber-500 dark:bg-amber-950/40 dark:border-amber-700 transition'
                        : 'p-2 rounded-xl border border-slate-200 dark:border-slate-700 text-slate-400 hover:text-amber-500 transition';
                }

                let optionsHTML = '';
                const labels = ['A', 'B', 'C', 'D'];

                q.a.forEach((optText, optIdx) => {
                    let optionStyle = 'border-slate-200 dark:border-slate-700 hover:border-blue-300 dark:hover:border-slate-600 bg-white dark:bg-slate-800 text-slate-800 dark:text-slate-100';
                    let badgeStyle = 'bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300';

                    if (this.mode === 'practice') {
                        if (selectedOpt !== undefined) {
                            if (optIdx === q.c) {
                                optionStyle = 'border-emerald-500 bg-emerald-50/80 dark:bg-emerald-950/40 text-emerald-900 dark:text-emerald-200 font-medium';
                                badgeStyle = 'bg-emerald-500 text-white font-bold';
                            } else if (selectedOpt === optIdx) {
                                optionStyle = 'border-rose-500 bg-rose-50/80 dark:bg-rose-950/40 text-rose-900 dark:text-rose-200';
                                badgeStyle = 'bg-rose-500 text-white font-bold';
                            }
                        }
                    } else {
                        if (selectedOpt === optIdx) {
                            optionStyle = 'border-blue-600 bg-blue-50 dark:bg-blue-950/50 text-blue-900 dark:text-blue-100 font-semibold ring-2 ring-blue-500';
                            badgeStyle = 'bg-blue-600 text-white font-bold';
                        }
                    }

                    optionsHTML += `
                        <button onclick="app.selectOption(${optIdx})" class="w-full text-left p-4 rounded-xl border-2 transition-all flex items-center gap-3.5 group ${optionStyle}">
                            <span class="w-8 h-8 rounded-lg flex items-center justify-center shrink-0 text-sm font-bold transition-colors ${badgeStyle}">
                                ${labels[optIdx]}
                            </span>
                            <span class="text-sm sm:text-base leading-relaxed flex-1">${optText}</span>
                        </button>
                    `;
                });

                let explanationHTML = '';
                if (this.mode === 'practice' && selectedOpt !== undefined) {
                    const isCorrect = selectedOpt === q.c;
                    explanationHTML = `
                        <div class="p-4 rounded-xl ${isCorrect ? 'bg-emerald-50 dark:bg-emerald-950/30 border border-emerald-200 dark:border-emerald-800' : 'bg-rose-50 dark:bg-rose-950/30 border border-rose-200 dark:border-rose-800'} space-y-2 animate-fade-in">
                            <div class="flex items-center gap-2 font-bold text-sm ${isCorrect ? 'text-emerald-700 dark:text-emerald-300' : 'text-rose-700 dark:text-rose-300'}">
                                <i class="fa-solid ${isCorrect ? 'fa-circle-check' : 'fa-circle-xmark'}"></i>
                                <span>${isCorrect ? 'Đáp án đúng!' : 'Chưa chính xác!'}</span>
                            </div>
                            <p class="text-xs sm:text-sm text-slate-700 dark:text-slate-300 leading-relaxed">
                                <strong>Đáp án chuẩn (${labels[q.c]}):</strong> ${q.a[q.c]}
                            </p>
                        </div>
                    `;
                }

                qContainer.innerHTML = `
                    <div class="bg-white dark:bg-slate-800 rounded-2xl p-6 border border-slate-200 dark:border-slate-700 shadow-sm space-y-6">
                        <div class="flex items-start justify-between gap-4 border-b border-slate-100 dark:border-slate-700 pb-4">
                            <div class="space-y-1">
                                <span class="text-xs font-bold text-red-600 dark:text-red-400 uppercase tracking-wider">
                                    ${CHAPTER_INFO[q.ch]?.title || 'Chương ' + q.ch}
                                </span>
                                <h3 class="text-base sm:text-lg font-bold text-slate-900 dark:text-white leading-snug">
                                    Câu ${this.currentIndex + 1}: ${q.q}
                                </h3>
                            </div>
                        </div>

                        <div class="space-y-3">
                            ${optionsHTML}
                        </div>

                        ${explanationHTML}
                    </div>
                `;
            }

            selectOption(optIndex) {
                const q = this.questions[this.currentIndex];
                if (!q) return;

                this.userAnswers[q.id] = optIndex;
                this.renderCurrentQuestion();
                this.renderGridNavigator();
            }

            prevQuestion() {
                if (this.currentIndex > 0) {
                    this.currentIndex--;
                    this.renderCurrentQuestion();
                    this.renderGridNavigator();
                }
            }

            nextQuestion() {
                if (this.currentIndex < this.questions.length - 1) {
                    this.currentIndex++;
                    this.renderCurrentQuestion();
                    this.renderGridNavigator();
                }
            }

            jumpToQuestion(index) {
                this.currentIndex = index;
                this.renderCurrentQuestion();
                this.renderGridNavigator();
            }

            toggleFlagCurrent() {
                const q = this.questions[this.currentIndex];
                if (!q) return;

                if (this.flagged.has(q.id)) {
                    this.flagged.delete(q.id);
                } else {
                    this.flagged.add(q.id);
                }

                localStorage.setItem('cnxhkh_bookmarks', JSON.stringify(Array.from(this.flagged)));
                this.renderCurrentQuestion();
                this.renderGridNavigator();
            }

            renderGridNavigator() {
                const grid = document.getElementById('grid-navigator');
                if (!grid) return;

                let html = '';
                this.questions.forEach((q, idx) => {
                    const isCurrent = idx === this.currentIndex;
                    const ans = this.userAnswers[q.id];
                    const isFlagged = this.flagged.has(q.id);

                    let btnStyle = 'bg-slate-100 dark:bg-slate-700 text-slate-700 dark:text-slate-300';

                    if (this.mode === 'practice') {
                        if (ans !== undefined) {
                            if (ans === q.c) {
                                btnStyle = 'bg-emerald-500 text-white font-bold';
                            } else {
                                btnStyle = 'bg-rose-500 text-white font-bold';
                            }
                        }
                    } else {
                        if (ans !== undefined) {
                            btnStyle = 'bg-blue-600 text-white font-bold';
                        }
                    }

                    if (isCurrent) {
                        btnStyle += ' ring-2 ring-offset-2 ring-blue-500 dark:ring-offset-slate-800';
                    }

                    html += `
                        <button onclick="app.jumpToQuestion(${idx})" class="h-9 rounded-lg text-xs font-semibold relative transition flex items-center justify-center ${btnStyle}">
                            ${idx + 1}
                            ${isFlagged ? '<span class="absolute top-0.5 right-0.5 w-2 h-2 rounded-full bg-amber-400"></span>' : ''}
                        </button>
                    `;
                });

                grid.innerHTML = html;
            }

            openSubmitModal() {
                const total = this.questions.length;
                const answered = Object.keys(this.userAnswers).length;
                const unanswered = total - answered;

                const textEl = document.getElementById('submit-summary-text');
                textEl.innerHTML = `
                    <p>Tổng số câu hỏi: <strong>${total}</strong> câu</p>
                    <p class="text-emerald-600 font-semibold">Đã khoanh: ${answered} câu</p>
                    ${unanswered > 0 ? `<p class="text-rose-600 font-bold">Chưa trả lời: ${unanswered} câu!</p>` : ''}
                `;

                document.getElementById('submit-modal').classList.remove('hidden');
            }

            closeSubmitModal() {
                document.getElementById('submit-modal').classList.add('hidden');
            }

            confirmSubmitExam() {
                if (this.timer) clearInterval(this.timer);
                this.endTime = new Date();
                this.closeSubmitModal();
                this.renderResultSummaryScreen();
            }

            // High precision summary & evaluation result screen
            renderResultSummaryScreen() {
                let correctCount = 0;
                let wrongCount = 0;
                let unansweredCount = 0;

                this.questions.forEach(q => {
                    const ans = this.userAnswers[q.id];
                    if (ans === undefined) {
                        unansweredCount++;
                    } else if (ans === q.c) {
                        correctCount++;
                    } else {
                        wrongCount++;
                    }
                });

                const total = this.questions.length;
                const score = parseFloat(((correctCount / total) * 10).toFixed(2));
                const accuracy = ((correctCount / total) * 100).toFixed(1);

                let rank = 'Yếu';
                let rankBadge = 'bg-rose-100 text-rose-800 border-rose-300 dark:bg-rose-950/60 dark:text-rose-300';
                if (score >= 9.0) { rank = 'Xuất Sắc'; rankBadge = 'bg-emerald-100 text-emerald-800 border-emerald-300 dark:bg-emerald-950/60 dark:text-emerald-300'; }
                else if (score >= 8.0) { rank = 'Giỏi'; rankBadge = 'bg-blue-100 text-blue-800 border-blue-300 dark:bg-blue-950/60 dark:text-blue-300'; }
                else if (score >= 6.5) { rank = 'Khá'; rankBadge = 'bg-indigo-100 text-indigo-800 border-indigo-300 dark:bg-indigo-950/60 dark:text-indigo-300'; }
                else if (score >= 5.0) { rank = 'Trung Bình'; rankBadge = 'bg-amber-100 text-amber-800 border-amber-300 dark:bg-amber-950/60 dark:text-amber-300'; }

                // Calculate total spent duration
                let durationText = 'Không tính';
                if (this.startTime && this.endTime) {
                    const diffSecs = Math.floor((this.endTime - this.startTime) / 1000);
                    const mins = Math.floor(diffSecs / 60);
                    const secs = diffSecs % 60;
                    durationText = `${mins} phút ${secs} giây`;
                }

                // Save record
                this.saveHistoryRecord({
                    date: new Date().toLocaleString('vi-VN'),
                    scopeTitle: this.getScopeTitle(this.selectedScope),
                    total,
                    correct: correctCount,
                    wrong: wrongCount,
                    unanswered: unansweredCount,
                    score,
                    accuracy
                });

                const container = document.getElementById('app-container');
                container.innerHTML = `
                    <div class="max-w-4xl mx-auto space-y-8 animate-fade-in">
                        <!-- Score Header Card -->
                        <div class="bg-white dark:bg-slate-800 rounded-3xl p-6 sm:p-8 border border-slate-200 dark:border-slate-700 shadow-xl space-y-6 text-center">
                            <div class="inline-flex items-center gap-2 px-4 py-1.5 rounded-full text-xs font-bold border ${rankBadge}">
                                <i class="fa-solid fa-award text-sm"></i> XẾP LOẠI: ${rank}
                            </div>

                            <div class="space-y-2">
                                <h2 class="text-5xl sm:text-6xl font-black text-slate-900 dark:text-white">
                                    ${score} <span class="text-2xl font-normal text-slate-400">/ 10</span>
                                </h2>
                                <p class="text-sm font-semibold text-slate-600 dark:text-slate-300">
                                    Tỷ lệ chính xác: <span class="text-red-600 dark:text-red-400 font-bold">${accuracy}%</span>
                                </p>
                            </div>

                            <!-- Detailed Stats Bar -->
                            <div class="grid grid-cols-2 sm:grid-cols-4 gap-4 pt-4 border-t border-slate-100 dark:border-slate-700">
                                <div class="p-4 rounded-2xl bg-emerald-50 dark:bg-emerald-950/40 border border-emerald-200 dark:border-emerald-800">
                                    <div class="text-emerald-600 dark:text-emerald-400 text-xs font-bold uppercase mb-1">
                                        <i class="fa-solid fa-circle-check mr-1"></i> Số câu Đúng
                                    </div>
                                    <div class="text-2xl font-extrabold text-emerald-700 dark:text-emerald-300">${correctCount}</div>
                                </div>

                                <div class="p-4 rounded-2xl bg-rose-50 dark:bg-rose-950/40 border border-rose-200 dark:border-rose-800">
                                    <div class="text-rose-600 dark:text-rose-400 text-xs font-bold uppercase mb-1">
                                        <i class="fa-solid fa-circle-xmark mr-1"></i> Số câu Sai
                                    </div>
                                    <div class="text-2xl font-extrabold text-rose-700 dark:text-rose-300">${wrongCount}</div>
                                </div>

                                <div class="p-4 rounded-2xl bg-amber-50 dark:bg-amber-950/40 border border-amber-200 dark:border-amber-800">
                                    <div class="text-amber-600 dark:text-amber-400 text-xs font-bold uppercase mb-1">
                                        <i class="fa-solid fa-circle-minus mr-1"></i> Chưa khoanh
                                    </div>
                                    <div class="text-2xl font-extrabold text-amber-700 dark:text-amber-300">${unansweredCount}</div>
                                </div>

                                <div class="p-4 rounded-2xl bg-slate-100 dark:bg-slate-700/50 border border-slate-200 dark:border-slate-600">
                                    <div class="text-slate-500 dark:text-slate-400 text-xs font-bold uppercase mb-1">
                                        <i class="fa-solid fa-stopwatch mr-1"></i> Thời gian
                                    </div>
                                    <div class="text-sm font-bold text-slate-800 dark:text-slate-200 mt-1">${durationText}</div>
                                </div>
                            </div>

                            <!-- Action Buttons -->
                            <div class="flex flex-wrap gap-3 pt-4">
                                <button onclick="app.reviewExamAnswers()" class="flex-1 py-3.5 px-4 rounded-xl bg-blue-600 hover:bg-blue-700 text-white font-bold text-sm shadow-md transition flex items-center justify-center gap-2">
                                    <i class="fa-solid fa-eye"></i> Xem lại bài làm
                                </button>
                                <button onclick="app.restartCurrentScope()" class="flex-1 py-3.5 px-4 rounded-xl bg-amber-500 hover:bg-amber-600 text-white font-bold text-sm shadow-md transition flex items-center justify-center gap-2">
                                    <i class="fa-solid fa-rotate-right"></i> Làm lại chương này
                                </button>
                                <button onclick="app.goHome()" class="w-full sm:w-auto py-3.5 px-6 rounded-xl border border-slate-300 dark:border-slate-600 font-bold text-slate-700 dark:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-700 transition">
                                    Chọn chương khác
                                </button>
                            </div>
                        </div>
                    </div>
                `;
            }

            reviewExamAnswers() {
                this.mode = 'practice';
                this.currentIndex = 0;
                this.renderQuizScreen();
            }

            restartCurrentScope() {
                this.startQuiz();
            }

            getScopeTitle(scope) {
                switch(scope) {
                    case 'c1': return 'Chương 1 (46 câu)';
                    case 'c2': return 'Chương 2 (90 câu)';
                    case 'c3': return 'Chương 3 (50 câu)';
                    case 'c4': return 'Chương 4 (69 câu)';
                    case 'c12': return 'Gộp C1 + C2 (136 câu)';
                    case 'c34': return 'Gộp C3 + C4 (119 câu)';
                    default: return 'Tổng hợp 4 Chương (255 câu)';
                }
            }

            saveHistoryRecord(record) {
                const history = JSON.parse(localStorage.getItem('cnxhkh_history') || '[]');
                history.unshift(record);
                localStorage.setItem('cnxhkh_history', JSON.stringify(history.slice(0, 15)));
            }

            showStatsModal() {
                const modal = document.getElementById('stats-modal');
                const content = document.getElementById('stats-content');
                const history = JSON.parse(localStorage.getItem('cnxhkh_history') || '[]');
                const bookmarks = Array.from(this.flagged);

                let historyHTML = history.length ? history.map(h => `
                    <div class="p-3.5 rounded-xl bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 flex items-center justify-between text-xs gap-2">
                        <div>
                            <span class="font-bold text-slate-900 dark:text-slate-100 block text-sm">${h.scopeTitle}</span>
                            <span class="text-slate-400 block mt-0.5">${h.date}</span>
                        </div>
                        <div class="text-right shrink-0">
                            <span class="font-black text-red-600 dark:text-red-400 text-base block">${h.score} Điểm</span>
                            <span class="text-emerald-600 dark:text-emerald-400">${h.correct}/${h.total} câu đúng</span>
                        </div>
                    </div>
                `).join('') : '<p class="text-xs text-slate-400 italic">Chưa có lịch sử thi thử.</p>';

                content.innerHTML = `
                    <div class="space-y-4">
                        <div class="p-4 rounded-xl bg-blue-50 dark:bg-blue-950/40 border border-blue-200 dark:border-blue-800 flex items-center justify-between">
                            <div>
                                <span class="text-xs text-blue-600 dark:text-blue-400 font-semibold block">SỐ CÂU HỎI ĐÃ ĐÁNH DẤU</span>
                                <span class="text-2xl font-black text-blue-900 dark:text-blue-100">${bookmarks.length} câu</span>
                            </div>
                            <i class="fa-solid fa-bookmark text-3xl text-blue-500"></i>
                        </div>

                        <div class="space-y-2">
                            <h4 class="font-bold text-sm text-slate-900 dark:text-white">Lịch sử làm bài gần đây</h4>
                            <div class="space-y-2 max-h-60 overflow-y-auto custom-scrollbar">
                                ${historyHTML}
                            </div>
                        </div>
                    </div>
                `;

                modal.classList.remove('hidden');
            }

            closeStatsModal() {
                document.getElementById('stats-modal').classList.add('hidden');
            }
        }

        // Initialize application instance on DOM load
        let app;
        window.addEventListener('DOMContentLoaded', () => {
            app = new QuizApp();
            app.renderDashboard();
        });
    </script>
</body>
</html>
